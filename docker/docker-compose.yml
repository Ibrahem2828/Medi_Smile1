services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medismile}
      POSTGRES_USER: ${POSTGRES_USER:-medismile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
    env_file: ../.env
    environment:
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
    env_file: ../.env
    environment:
      RUN_MIGRATIONS: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      PRIVATE_MEDIA_ROOT: /app/private_media
    ports:
      - "8000:8000"
    volumes:
      - private_media:/app/private_media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
    env_file: ../.env
    environment:
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      PRIVATE_MEDIA_ROOT: /app/private_media
    command: ["celery", "-A", "medismile", "worker", "--loglevel=INFO"]
    volumes:
      - private_media:/app/private_media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  private_media:
