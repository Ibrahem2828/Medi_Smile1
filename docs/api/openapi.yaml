openapi: 3.0.3
info:
  title: MediSmile API
  version: 1.1.0
  description: 'REST API of the MediSmile dental training & consultation platform.
    All endpoints are under /api/ and authenticate with `Authorization: Bearer <JWT
    access token>` obtained from /api/accounts/login/<role>/.'
paths:
  /api/accounts/login/patient/:
    post:
      operationId: accounts_login_patient_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleBasedLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleBasedLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleBasedLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
