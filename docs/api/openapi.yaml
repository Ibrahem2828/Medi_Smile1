  /api/ai/diagnose/:
    post:
      operationId: ai_diagnose_create
      description: |-
        POST /api/ai/diagnose/ — run the text + image AI pipeline for the patient.

        Accepts JSON (``symptoms_text`` + optional ``image_ids``) or multipart
        (``symptoms_text`` + image file under ``image``/``images``/``image_file``).
        Returns 201 on success and 503 (with the FAILED diagnosis) when every AI
        engine is unavailable.
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIDiagnosisRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIDiagnoseMultipartRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIDiagnoseResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIDiagnoseResponse'
          description: Every AI engine failed; `diagnosis.status` is `failed` and
            `detail` holds a user-facing message.
