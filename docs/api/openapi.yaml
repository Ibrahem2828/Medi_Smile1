components:
  schemas:
    AICriticalCaseCreateRequest:
      type: object
      description: Patient routes a *server-owned* AI diagnosis to a university.
      properties:
        university_id:
          type: string
          format: uuid
        diagnosis_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
      required:
      - diagnosis_id
      - university_id
    AIDiagnoseMultipartRequest:
      type: object
      description: 'Documentation-only: multipart form accepted by POST /api/ai/diagnose/.'
      properties:
        symptoms_text:
          type: string
          minLength: 10
          maxLength: 4000
        image:
          type: string
          format: binary
          description: Dental photo (JPEG/PNG/WebP, max 10 MB)
        image_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - symptoms_text
    AIDiagnoseResponse:
      type: object
      description: 'Documentation-only: body returned by POST /api/ai/diagnose/ (201
        and 503).'
      properties:
        diagnosis:
          $ref: '#/components/schemas/AIDiagnosis'
        primary_suggestion:
          nullable: true
        next_suggestion:
          nullable: true
        all_suggestions: {}
        detail:
          type: string
          description: Present only on 503
      required:
      - all_suggestions
      - diagnosis
      - next_suggestion
      - primary_suggestion
    AIDiagnosis:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AIDiagnosisStatusEnum'
          readOnly: true
        error_message:
          type: string
          readOnly: true
          description: Set when engine fails
        case:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
          readOnly: true
        requested_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        raw_symptoms:
          type: string
          readOnly: true
          title: Raw Symptoms Input
        normalized_symptoms:
          type: string
          readOnly: true
          nullable: true
        diagnosis_label:
          type: string
          readOnly: true
          description: Internal label returned by engine/fusion (technical)
        primary_diagnosis:
          type: string
          readOnly: true
          nullable: true
        detected_findings:
          readOnly: true
          nullable: true
          description: Structured list of findings (JSON)
        patient_explanation:
          type: string
          readOnly: true
        report_text:
          type: string
          readOnly: true
          nullable: true
          title: Detailed Report Text
        recommendations:
          type: string
          readOnly: true
          nullable: true
        confidence_level:
          allOf:
          - $ref: '#/components/schemas/ConfidenceLevelEnum'
          readOnly: true
        severity_level:
          allOf:
          - $ref: '#/components/schemas/SeverityLevelEnum'
          readOnly: true
        urgency_level:
          allOf:
          - $ref: '#/components/schemas/UrgencyLevelEnum'
          readOnly: true
        reviewed_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        ai_metadata:
          readOnly: true
          nullable: true
          description: Technical output payload from engine (kept for audit/debug)
      required:
      - ai_metadata
      - case
      - confidence_level
      - created_at
      - detected_findings
      - diagnosis_label
      - error_message
      - id
      - normalized_symptoms
      - patient
      - patient_explanation
      - primary_diagnosis
      - raw_symptoms
      - recommendations
      - report_text
      - requested_by
      - reviewed_at
      - reviewed_by
      - severity_level
      - status
      - updated_at
      - urgency_level
    AIDiagnosisRequestRequest:
      type: object
      description: |-
        Input for ``POST /api/ai/diagnose/``.

        Images can be supplied in three ways (first match wins):
        1. multipart files under ``image`` / ``images`` / ``image_file`` (handled by the view);
        2. ``image_ids`` — ids returned by ``POST /api/ai/images/`` (preferred for JSON clients);
        3. ``image_urls`` — legacy; only hosts in ``AI_IMAGE_URL_ALLOWED_HOSTS`` are accepted
           (the backend fetches them, so an open list would be an SSRF hole).
      properties:
        symptoms_text:
          type: string
          minLength: 10
          maxLength: 4000
        patient_id:
          type: string
          format: uuid
          nullable: true
        image_ids:
          type: array
          items:
            type: string
            format: uuid
          description: IDs returned by POST /api/ai/images/
          maxItems: 5
        image_urls:
          type: array
          items:
            type: string
            format: uri
            minLength: 1
          description: 'Legacy: image URLs on an allow-listed host (AI_IMAGE_URL_ALLOWED_HOSTS)'
          maxItems: 5
      required:
      - symptoms_text
    AIDiagnosisReviewRequest:
      type: object
      properties:
        approved:
          type: boolean
          default: true
        note:
          type: string
          nullable: true
          maxLength: 500
    AIDiagnosisReviewResponse:
      type: object
      properties:
        diagnosis:
          $ref: '#/components/schemas/AIDiagnosis'
      required:
      - diagnosis
    AIDiagnosisStatusEnum:
      enum:
      - pending
      - completed
      - partial
      - insufficient_evidence
      - failed
      - reviewed
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `partial` - Partial Evidence
        * `insufficient_evidence` - Insufficient Evidence
        * `failed` - Failed
        * `reviewed` - Reviewed by Supervisor
    AIEnginesHealth:
      type: object
      properties:
        engines: {}
      required:
      - engines
    AIImageUpload:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
          title: Size (bytes)
        width:
          type: integer
          readOnly: true
        height:
          type: integer
          readOnly: true
        sha256:
          type: string
          readOnly: true
          title: SHA-256
        diagnosis:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        file_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - diagnosis
      - file_url
      - height
      - id
      - sha256
      - size_bytes
      - width
    AIImageUploadCreateRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
      required:
      - image
    AIProposal:
